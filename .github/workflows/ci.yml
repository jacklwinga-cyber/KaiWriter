name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test
      # build = tsc -b && vite build
      - run: npm run build
      # Lint is not gated yet: ~43 pre-existing react-hooks errors. Add `npm run lint` once cleared.
