<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="KaiWriter — professional documents without Word's complexity. Templates, cloud sync, and privacy-first editing on kainoter.com." />
    <link rel="canonical" href="https://kaiwriter.kainoter.com/" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script>
      (function () {
        var t = localStorage.getItem('kaiwriter-theme');
        if (t !== 'light') document.documentElement.classList.add('dark-theme');
      })();
    </script>
    <title>KaiWriter</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
